# CORSIA default life-cycle emissions values for SAF pathways (Phase 2.3, V6/V7)
#
# Source: ICAO document "CORSIA Default Life Cycle Emissions Values for CORSIA
# Eligible Fuels", 8th Edition, November 2025 (approved 19 November 2025).
# https://www.icao.int/sites/default/files/environmental-protection/CORSIA/Documents/CORSIA%20Eligible%20Fuels/ICAO-document-06-Default-Life-Cycle-Emissions-November-2025.pdf
# Values verified against the PDF tables on 2026-07-13. All values in gCO2e/MJ.
#
# L_CEF = core LCA + ILUC (Doc 06 §3.1). Feedstocks classified as wastes,
# residues, or by-products have default ILUC = 0 (Doc 06 §5.2). For main-product
# feedstocks the ILUC values below are the applicability-provision-[1] (most
# recent, unrestricted) rows of Tables 7-10, Global region unless noted.
#
# min/mode/max define the triangular distribution sampled by the Monte Carlo in
# scripts/optimization/optimize_blend.py:
#   min  = best plausible feedstock actually used for the pathway
#   mode = a representative mid feedstock (chosen and documented per pathway)
#   max  = worst-case listed feedstock incl. ILUC
# The old point factors {HEFA 0.2, FT 0.1, ATJ 0.3} sat near each pathway's
# BEST case and carried no source.

baseline_fossil_gCO2e_MJ: 89.0   # Doc 06 §3.1.1 eq. 2 fossil-jet baseline

pathways:
  HEFA:
    # Conversion process: HEFA (ASTM D7566 Annex A2) — Doc 06 Table 2 (core)
    # and Table 8 (ILUC).
    feedstocks:
      - name: used_cooking_oil
        core: 13.9          # Table 2 row 2.6
        iluc: 0.0           # waste/residue, §5.2
        lcef: 13.9
      - name: tallow_mixed_animal_fats
        core: 28.6          # Table 2 row 2.5 (mixed animal fats)
        iluc: 0.0           # by-product, §5.2
        lcef: 28.6
      - name: palm_fatty_acid_distillate
        core: 20.7          # Table 2 row 2.7
        iluc: 0.0           # by-product, §5.2
        lcef: 20.7
      - name: corn_oil_dry_mill
        core: 17.2          # Table 2 row 2.8
        iluc: 0.0           # by-product, §5.2
        lcef: 17.2
      - name: soybean_oilseed_global
        core: 40.4          # Table 2 row 2.9
        iluc: 22.5          # Table 8 row 8.16 (Global, [1])
        lcef: 62.9
      - name: rapeseed_canola_global
        core: 47.4          # Table 2 row 2.10
        iluc: 23.9          # Table 8 row 8.18 (Global, [1])
        lcef: 71.3
      - name: palm_ffb_high_capture
        core: 37.4          # Table 2 row 2.11 (>=85% POME biogas capture)
        iluc: 36.6          # Table 8 row 8.19 (Malaysia & Indonesia, [1])
        lcef: 74.0
    triangular:
      min: 13.9             # used cooking oil (2.6)
      mode: 28.6            # mixed animal fats (2.5) — representative mid case
      max: 74.0             # palm FFB high-capture + ILUC (2.11 + 8.19)

  FT:
    # Conversion process: Gasification FT (ASTM D7566 Annex A1) — Doc 06
    # Table 1 (core) and Table 7 (ILUC).
    feedstocks:
      - name: msw_0pct_nbc
        core: 5.2           # Table 1 row 1.3
        iluc: 0.0           # waste, §5.2
        lcef: 5.2
      - name: agricultural_residues
        core: 7.7           # Table 1 row 1.1
        iluc: 0.0           # residue, §5.2
        lcef: 7.7
      - name: forestry_residues
        core: 8.3           # Table 1 row 1.2
        iluc: 0.0           # residue, §5.2
        lcef: 8.3
      - name: miscanthus_global
        core: 10.4          # Table 1 row 1.6
        iluc: -13.8         # Table 7 row 7.12 (Global, [1])
        lcef: -3.4
      - name: poplar_global
        core: 12.2          # Table 1 row 1.5
        iluc: 8.9           # Table 7 row 7.9 (Global, [1])
        lcef: 21.1
      - name: switchgrass_global
        core: 10.4          # Table 1 row 1.7
        iluc: 6.6           # Table 7 row 7.14 (Global, [1])
        lcef: 17.0
    triangular:
      min: -3.4             # miscanthus global incl. negative ILUC (1.6 + 7.12)
      mode: 7.7             # agricultural residues (1.1) — representative mid case
      max: 21.1             # poplar global (1.5 + 7.9)

  ATJ:
    # Conversion process: ATJ-SPK from isobutanol (ASTM D7566 Annex A5) —
    # Doc 06 Table 3 (core) and Table 9 (ILUC). The fuels.py ATJ surrogate is
    # an isobutanol-type SPK (iso-octane dominant), so the isobutanol tables
    # apply; ethanol-ATJ (Tables 4/10) values are similar or higher.
    feedstocks:
      - name: forestry_residues
        core: 23.8          # Table 3 row 3.2
        iluc: 0.0           # residue, §5.2
        lcef: 23.8
      - name: sugarcane_global
        core: 24.0          # Table 3 row 3.3
        iluc: 9.9           # Table 9 row 9.13 (Global, [1])
        lcef: 33.9
      - name: molasses_global
        core: 27.0          # Table 3 row 3.7
        iluc: 9.9           # Table 9 row 9.22 (Global, [1])
        lcef: 36.9
      - name: agricultural_residues
        core: 29.3          # Table 3 row 3.1
        iluc: 0.0           # residue, §5.2
        lcef: 29.3
      - name: miscanthus_global
        core: 43.4          # Table 3 row 3.5
        iluc: -25.2         # Table 9 row 9.18 (Global, [1])
        lcef: 18.2
      - name: corn_grain_global
        core: 55.8          # Table 3 row 3.4
        iluc: 25.6          # Table 9 row 9.15 (Global, [1])
        lcef: 81.4
    triangular:
      min: 18.2             # miscanthus global incl. negative ILUC (3.5 + 9.18)
      mode: 29.3            # agricultural residues (3.1) — representative mid case
      max: 81.4             # corn grain global (3.4 + 9.15)
