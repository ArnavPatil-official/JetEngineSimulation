# catjet-pycycle: pyCycle reference environment (Phase 8, track D2).
# Purpose: run pyCycle's published high-bypass turbofan example unmodified, as
# the code-to-code check target for the project's C++ off-design matching
# solver (P8.4). Separate from .venv and catjet-cpp; never mixed with them.
#
# Pins follow pyCycle 4.4.0 (tag 4.4.0, 2025-10-15, commit 867f1d6):
#   - setup.py: install_requires openmdao>=3.10.0; extras 'test' = testflo, parameterized
#   - release notes 4.4.0: adapted to OpenMDAO 3.39/3.40 API changes (#103, #109)
#   - CI baseline (.github/workflows/pycycle_test_workflow.yml @4.4.0):
#     python 3.12, numpy 1.26, scipy 1.14, OpenMDAO 'latest' from PyPI at the time
#   - latest OpenMDAO on PyPI at the 4.4.0 release date: 3.41.0 (2025-10-06)
# om-pycycle is not on conda-forge, so it comes from PyPI via pip inside the env.
#
# Create:  ~/miniforge3/bin/conda env create -f envs/pycycle/environment.yml
# Exact:   see envs/pycycle/README.md (lockfile + pip-freeze route)
name: catjet-pycycle
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - numpy=1.26.4
  - scipy=1.14.1
  - openmdao=3.41.0
  - pytest=9.1.1
  - parameterized=0.9.0
  - testflo=1.4.22
  - pip
  - pip:
      - om-pycycle==4.4.0
